<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weather</title>
  <meta name="description" content="Current conditions and forecast powered by Open-Meteo.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⛅</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section id="auth" class="app auth" hidden>
    <form id="auth-form" class="card auth-form">
      <h1>⛅ Weather</h1>
      <p class="muted">Sign in with your email to see the forecast.</p>
      <label>Email
        <input id="email" type="email" autocomplete="email" required>
      </label>
      <label>Password
        <input id="password" type="password" autocomplete="current-password" minlength="6" required>
      </label>
      <button id="signin" type="submit" class="primary">Sign in</button>
      <button id="signup" type="button">Create account</button>
      <p id="auth-msg" class="status" role="status"></p>
    </form>
  </section>

  <main id="weather" class="app" hidden>
    <header class="top">
      <form id="search" class="search" autocomplete="off" role="search">
        <input id="query" type="search" placeholder="Search a city…" aria-label="Search a city">
        <ul id="results" class="results" role="listbox" hidden></ul>
      </form>
      <div class="controls">
        <button id="locate" type="button" title="Use my location" aria-label="Use my location">📍</button>
        <button id="unit" type="button" title="Toggle units" aria-label="Toggle units">°F</button>
        <button id="signout" type="button" title="Sign out">Sign out</button>
      </div>
    </header>

    <p id="status" class="status" role="status"></p>

    <section id="current" class="card current" hidden>
      <div>
        <h1 id="place"></h1>
        <p id="updated" class="muted"></p>
        <div class="now">
          <span id="icon" class="icon" aria-hidden="true"></span>
          <span id="temp" class="temp"></span>
        </div>
        <p id="desc" class="desc"></p>
        <p id="hilo" class="muted"></p>
      </div>
      <dl class="stats">
        <div><dt>Feels like</dt><dd id="feels"></dd></div>
        <div><dt>Humidity</dt><dd id="humidity"></dd></div>
        <div><dt>Wind</dt><dd id="wind"></dd></div>
        <div><dt>Rain chance</dt><dd id="precip"></dd></div>
        <div><dt>UV index</dt><dd id="uv"></dd></div>
        <div><dt>Sunrise / Sunset</dt><dd id="sun"></dd></div>
      </dl>
    </section>

    <section id="hourly-wrap" class="card" hidden>
      <h2>Next 24 hours</h2>
      <ol id="hourly" class="hourly"></ol>
    </section>

    <section id="daily-wrap" class="card" hidden>
      <h2>7-day forecast</h2>
      <ol id="daily" class="daily"></ol>
    </section>

    <footer class="muted">Weather data by <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a></footer>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
